<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NitxZec</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 800px;
      text-align: center;
      padding: 40px 20px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #161b22;
      border: 2px solid #30363d;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
    }

    h1 {
      color: #f0f6fc;
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #8b949e;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .description {
      line-height: 1.7;
      margin: 0 auto 30px;
      max-width: 650px;
      color: #8b949e;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .links a {
      text-decoration: none;
      color: #f0f6fc;
      border: 1px solid #30363d;
      padding: 10px 18px;
      border-radius: 6px;
      transition: 0.2s;
    }

    .links a:hover {
      background: #21262d;
      border-color: #8b949e;
    }

    footer {
      margin-top: 50px;
      font-size: 13px;
      color: #484f58;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 32px;
      }

      .subtitle {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="avatar">
      ⚡
    </div>

    <h1>NitxZec</h1>

    <p class="subtitle">
      Cybersecurity • IT Infrastructure • Technology
    </p>

    <p class="description">
      Welcome to my personal space on GitHub.
      I work with cybersecurity, security monitoring, networking,
      infrastructure, and technology projects.
    </p>

    <div class="links">
      <a href="https://github.com/" target="_blank">GitHub</a>
      <a href="https://www.linkedin.com/" target="_blank">LinkedIn</a>
      <a href="#" target="_blank">Projects</a>
      <a href="#" target="_blank">Contact</a>
    </div>

    <footer>
      © 2026 NitxZec
    </footer>

  </main>

</body>
</html>
