<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FCM Web Push PoC</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
    }
    button {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 6px;
      width: 100%;
      cursor: pointer;
    }
    .token-box {
      margin-top: 20px;
      word-break: break-all;
      background: #f1f5f9;
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h2>FCM Push Notification PoC</h2>
  <button id="enable-btn">Enable Notifications</button>

  <h3>Device FCM Token:</h3>
  <div id="token" class="token-box">Token will appear here...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBX3KCMDyL00gFZmLW_G940uo3Vh4DwZbw",
      authDomain: "simple-web-push-poc.firebaseapp.com",
      projectId: "simple-web-push-poc",
      storageBucket: "simple-web-push-poc.firebasestorage.app",
      messagingSenderId: "286960834774",
      appId: "1:286960834774:web:1a235076528fbd7c5bd177",
      measurementId: "G-PB0GSE7Q4C"
    };
    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);

    // 1. Get the repository name/subpath dynamically from the current URL
    const repoPath = window.location.pathname.replace(/\/$/, ''); // Removes trailing slash

    let swRegistration = null;

    if ('serviceWorker' in navigator) {
      // Use relative path './firebase-messaging-sw.js' instead of root '/'
      navigator.serviceWorker.register('./firebase-messaging-sw.js', {
        scope: './'
      })
      .then((registration) => {
        swRegistration = registration;
        console.log('Service Worker registered successfully at scope:', registration.scope);
      })
      .catch((err) => {
        console.error('Service Worker registration failed:', err);
      });
    }

    // 2. Fetch token passing the registered Service Worker directly
    enableBtn.addEventListener("click", async () => {
      try {
        const permission = await Notification.requestPermission();
        if (permission === "granted") {
          const currentToken = await getToken(messaging, { 
            vapidKey: "BK7TeFd5gWn897bYRvNlAuujHXFd7wJhTCV2h-6lNXunWd41BNqx_R9yYRIxg2UcsZz9PahfgYs5TxJDKLHe4K0",
            // : Pass the explicit registration so Firebase doesn't default to domain root
            serviceWorkerRegistration: swRegistration 
          });

          console.log("FCM Token:", currentToken);
          document.getElementById("token").innerText = currentToken;
        }
      } catch (err) {
        console.error("Error getting token: ", err);
      }
    });
  </script>
</body>
</html>
