<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FCM Web Push PoC</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
    }
    button {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 6px;
      width: 100%;
      cursor: pointer;
    }
    .token-box {
      margin-top: 20px;
      word-break: break-all;
      background: #f1f5f9;
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h2>FCM Push Notification PoC</h2>
  <button id="enable-btn">Enable Notifications</button>

  <h3>Device FCM Token:</h3>
  <div id="token" class="token-box">Token will appear here...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

    // 1. Replace with your actual Firebase configuration
    // const firebaseConfig = {
    //   apiKey: "YOUR_API_KEY",
    //   authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    //   projectId: "YOUR_PROJECT_ID",
    //   storageBucket: "YOUR_PROJECT_ID.firebasestorage.app",
    //   messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    //   appId: "YOUR_APP_ID"
    // };
    const firebaseConfig = {
      apiKey: "AIzaSyBX3KCMDyL00gFZmLW_G940uo3Vh4DwZbw",
      authDomain: "simple-web-push-poc.firebaseapp.com",
      projectId: "simple-web-push-poc",
      storageBucket: "simple-web-push-poc.firebasestorage.app",
      messagingSenderId: "286960834774",
      appId: "1:286960834774:web:1a235076528fbd7c5bd177",
      measurementId: "G-PB0GSE7Q4C"
    };

    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);

    // 2. Replace with your VAPID Public Key from Firebase Console
    const VAPID_KEY = "BK7TeFd5gWn897bYRvNlAuujHXFd7wJhTCV2h-6lNXunWd41BNqx_R9yYRIxg2UcsZz9PahfgYs5TxJDKLHe4K0";

    const enableBtn = document.getElementById("enable-btn");
    const tokenDisplay = document.getElementById("token");

    // Register Service Worker explicitly
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/web_notification_poc/firebase-messaging-sw.js')
        .then((registration) => {
          console.log('Service Worker registered successfully with scope:', registration.scope);
        })
        .catch((err) => {
          console.error('Service Worker registration failed:', err);
        });
    }

    enableBtn.addEventListener("click", async () => {
      try {
        const permission = await Notification.requestPermission();
        if (permission === "granted") {
          const currentToken = await getToken(messaging, { 
            vapidKey: VAPID_KEY 
          });

          if (currentToken) {
            tokenDisplay.innerText = currentToken;
            console.log("FCM Token:", currentToken);
          } else {
            tokenDisplay.innerText = "No Registration token available. Request permission to generate one.";
          }
        } else {
          tokenDisplay.innerText = "Notification permission denied.";
        }
      } catch (err) {
        console.error("An error occurred while retrieving token: ", err);
        tokenDisplay.innerText = "Error getting token: " + err.message;
      }
    });

    // Handle messages received while web page is in foreground
    onMessage(messaging, (payload) => {
      console.log('Foreground message received: ', payload);
      alert(`[${payload.notification.title}]: ${payload.notification.body}`);
    });
  </script>
</body>
</html>
